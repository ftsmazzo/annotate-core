<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Annotate — Configuração</title>
    <style>
      :root {
        --primary: #4f46e5; --primary-hover: #4338ca; --border: #e6e8f0; --text: #16181d;
        --text-muted: #6b7280; --danger: #ef4444; --radius: 12px;
      }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f4f5fa;
        color: var(--text); padding: 40px 20px;
      }
      .wrap { max-width: 560px; margin: 0 auto; }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
      .brand .mark {
        width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), #7c3aed);
        display: flex; align-items: center; justify-content: center;
      }
      .brand h1 { font-size: 18px; margin: 0; }
      p.hint { font-size: 13px; color: var(--text-muted); margin: 0 0 20px; }
      .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
      .card + .card { margin-top: 16px; }
      label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-top: 12px; }
      label:first-child { margin-top: 0; }
      input {
        width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
        border: 1px solid var(--border); margin-top: 4px; font-size: 14px; font-family: inherit;
      }
      input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px #eef2ff; }
      button {
        padding: 10px 18px; border-radius: 8px; border: none; background: var(--primary);
        color: #fff; cursor: pointer; font-size: 13px; font-weight: 600;
      }
      button:hover { background: var(--primary-hover); }
      #add { width: 100%; margin-top: 16px; padding: 12px; }
      ul { list-style: none; padding: 0; margin: 0; }
      li {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
        margin-bottom: 8px; font-size: 13px; background: #fafafe;
      }
      li .remove { background: var(--danger); padding: 6px 12px; font-size: 12px; }
      li .remove:hover { background: #dc2626; }
      #status { margin-top: 10px; font-size: 12.5px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">
        <span class="mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 20h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5Z" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </span>
        <h1>Annotate — sites configurados</h1>
      </div>
      <p class="hint">Cada site abaixo usa o token do projeto certo automaticamente — sem escolher nada na hora de reportar.</p>

      <div class="card">
        <ul id="list"></ul>
      </div>

      <div class="card">
        <label>Domínio do site (ex: meusite.com.br)</label>
        <input id="hostname" placeholder="ecommtabil-app.kxryyk.easypanel.host" />
        <label>Endpoint do servidor</label>
        <input id="endpoint" placeholder="https://annotate-core-server.kxryyk.easypanel.host" />
        <label>Token do projeto (widget)</label>
        <input id="token" placeholder="atn_w_..." />
        <button id="add">Adicionar site</button>
        <div id="status"></div>
      </div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
