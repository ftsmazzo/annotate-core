<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 280px; font-family: system-ui, sans-serif; padding: 12px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      label { display: block; font-size: 12px; color: #6b7280; margin-top: 8px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; border-radius: 6px; border: 1px solid #d1d5db; margin-top: 2px; }
      button { width: 100%; margin-top: 12px; padding: 8px; border-radius: 6px; border: none; background: #2563eb; color: #fff; cursor: pointer; }
      #status { margin-top: 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Annotate — configuração</h1>
    <label>Endpoint do servidor</label>
    <input id="endpoint" placeholder="https://annotate-core-server.kxryyk.easypanel.host" />
    <label>Token do projeto (widget)</label>
    <input id="token" placeholder="atn_w_..." />
    <button id="save">Salvar</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
