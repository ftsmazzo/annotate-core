<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { width: 320px; font-family: system-ui, sans-serif; padding: 12px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p.hint { font-size: 11px; color: #6b7280; margin: 0 0 10px; }
      label { display: block; font-size: 12px; color: #6b7280; margin-top: 8px; }
      input { width: 100%; box-sizing: border-box; padding: 6px; border-radius: 6px; border: 1px solid #d1d5db; margin-top: 2px; }
      button { padding: 6px 12px; border-radius: 6px; border: none; background: #2563eb; color: #fff; cursor: pointer; font-size: 12px; }
      #add { width: 100%; margin-top: 10px; padding: 8px; }
      ul { list-style: none; padding: 0; margin: 12px 0 0; }
      li { padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 6px; font-size: 12px; }
      li .row { display: flex; justify-content: space-between; align-items: center; }
      li .remove { background: #dc2626; }
      #status { margin-top: 8px; font-size: 11px; color: #16a34a; }
    </style>
  </head>
  <body>
    <h1>Annotate — sites configurados</h1>
    <p class="hint">Cada site abaixo usa o token do projeto certo automaticamente — sem escolher nada na hora.</p>

    <ul id="list"></ul>

    <label>Domínio do site (ex: meusite.com.br)</label>
    <input id="hostname" placeholder="ecommtabil-app.kxryyk.easypanel.host" />
    <label>Endpoint do servidor</label>
    <input id="endpoint" placeholder="https://annotate-core-server.kxryyk.easypanel.host" />
    <label>Token do projeto (widget)</label>
    <input id="token" placeholder="atn_w_..." />
    <button id="add">Adicionar site</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
